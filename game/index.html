<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" href="data:," />
  <title>Не попадись!</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Игровое поле -->
    <canvas id="game"></canvas>

    <!-- HUD во время забега -->
    <div id="hud" class="hud hidden">
      <div class="hud-left">
        <div class="hud-chip" id="distance">0 м</div>
        <div class="hud-chip coins" id="coins"><span class="coin-dot"></span><span id="coins-n">0</span></div>
      </div>
      <div class="hud-right">
        <div class="hud-chip combo hidden" id="combo">x2</div>
        <div class="chase" id="chase" aria-label="Погоня">
          <span class="chase-track"><span class="chase-v"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#4a2bd0"/><ellipse cx="12" cy="13.5" rx="7" ry="6" fill="#ffd9b8"/><rect x="4.5" y="9" width="15" height="4.6" rx="2.3" fill="#14143a"/><circle cx="9" cy="11.3" r="1.4" fill="#fff"/><circle cx="15" cy="11.3" r="1.4" fill="#fff"/></svg></span></span>
          <span class="chase-h">🛡️</span>
        </div>
        <button class="icon-btn" id="sound-run" aria-label="Звук">🔈</button>
      </div>
    </div>

    <!-- Подсказка действий (нижние дорожки) -->
    <div id="lane-legend" class="lane-legend hidden">
      <button class="legend-item lane-btn" data-lane="0" aria-label="Отказать"><span class="lb-circle"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></span><span class="lb-label">Отказать</span></button>
      <button class="legend-item lane-btn" data-lane="1" aria-label="Проверить"><span class="lb-circle"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15.2 15.2l4.8 4.8"/></svg></span><span class="lb-label">Проверить</span></button>
      <button class="legend-item lane-btn" data-lane="2" aria-label="Можно"><span class="lb-circle"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="lb-label">Можно</span></button>
    </div>

    <!-- Подсказка обучения -->
    <div id="tut" class="tut hidden"></div>

    <!-- Тост ачивки -->
    <div id="toast" class="toast hidden"></div>

    <!-- Всплывающее «почему» при ошибке -->
    <div id="flash" class="flash hidden"></div>

    <!-- Стартовый экран -->
    <section id="screen-start" class="screen">
      <div class="brand">
        <h1 class="game-title">Не <span class="accent">попадись!</span></h1>
        <p class="subtitle">Раскуси 7 жуликов на бегу</p>
      </div>
      <div class="start-stage" aria-hidden="true"></div>
      <div class="start-bottom">
        <button class="btn-primary" id="btn-play">Играть</button>
        <label class="sound-toggle">
        <input type="checkbox" id="sound-toggle" />
        <span class="pill" aria-hidden="true"></span>
        <span class="sound-lbl">Звук</span>
      </label>
      </div>
    </section>

    <!-- Экран итога -->
    <section id="screen-end" class="screen hidden">
      <h2 class="end-title" id="end-title">Финиш!</h2>

      <div class="end-villains" id="end-villains">
        <p class="villains-title" id="villains-title"></p>
        <div class="villains-grid" id="villains-grid"></div>
      </div>

      <div class="end-ach hidden" id="end-ach"></div>

      <div class="end-actions">
        <button class="btn-primary" id="btn-again">Ещё раз</button>
      </div>

      <div class="end-links">
        <button class="btn-text" id="btn-more">Подробнее</button>
        <span class="dot">·</span>
        <button class="btn-text" id="btn-close">Выйти</button>
      </div>
      <details class="more" id="more">
        <summary hidden>Подробнее</summary>
        <div class="end-stats">
          <div class="stat"><div class="stat-num" id="end-distance">0</div><div class="stat-lbl">метров</div></div>
          <div class="stat"><div class="stat-num" id="end-recognized">0/0</div><div class="stat-lbl">ловушек распознано</div></div>
          <div class="stat"><div class="stat-num" id="end-coins">0</div><div class="stat-lbl">монет</div></div>
        </div>
        <div class="decisions" id="end-decisions"></div>
        <div class="progress hidden" id="end-progress"></div>
        <div class="review" id="review">
          <p class="review-title hidden" id="review-title">Разбор ошибок</p>
          <div id="review-list"></div>
        </div>
      </details>

    </section>

    <!-- Загрузка -->
    <section id="screen-loading" class="screen">
      <div class="loader"></div>
      <p>Загрузка…</p>
    </section>
  </div>

  <script src="content.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
